# baton-ts CI — lint + typecheck + test + build on every PR and push to main.
#
# submodules: true is load-bearing — baton-spec (events.schema.json +
# vectors/*.json) is the wire-conformance test's fixture source; without it
# checked out, test/conformance.test.ts fails to find its files rather than
# skipping quietly.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec-pin:
    # Warns, never fails: a stale pin is how SDKs drift apart unnoticed, but
    # bumping it is its own change with its own vectors to pass. Not on PRs,
    # so the same warning does not sit on every unrelated one.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: .gitmodules
          sparse-checkout-cone-mode: false
      - name: Does the baton-spec pin differ from baton-spec main?
        run: |
          pinned=$(git ls-tree HEAD baton-spec | awk '$1 == "160000" { print $3 }')
          url=$(git config -f .gitmodules submodule.baton-spec.url || true)
          latest=$(timeout 30 git ls-remote "$url" refs/heads/main | awk '$2 == "refs/heads/main" { print $1 }' || true)
          if [ -z "$pinned" ] || [ -z "$latest" ]; then
            echo "::warning title=baton-spec pin not checked::could not read the pin or $url"
          elif [ "$pinned" != "$latest" ]; then
            echo "::warning title=baton-spec pin differs from main::pinned $pinned, baton-spec main is $latest"
          fi

  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run ci
